[package]
name = "ink-engine"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib = the .wasm file, rlib = lets `cargo test` run natively
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
# skips the wasm-opt download so builds never fail offline; remove to shrink the .wasm
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
