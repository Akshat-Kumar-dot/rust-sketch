<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Ink</title>
    <style>
      :root { --bar: #1c1c1f; --fg: #e8e8ea; --muted: #8b8b93; --accent: #6ea8fe; --bad: #ff6b6b; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 13px/1.4 system-ui, sans-serif; }
      #bar {
        position: fixed; inset: 0 0 auto 0; height: 46px; z-index: 10;
        display: flex; align-items: center; gap: 12px; padding: 0 12px;
        background: var(--bar); color: var(--fg);
      }
      #bar label { display: flex; align-items: center; gap: 6px; color: var(--muted); user-select: none; }
      #bar input[type="color"] { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
      #bar input[type="range"] { width: 90px; }
      #bar button {
        background: #2b2b30; color: var(--fg); border: 1px solid #3a3a40; border-radius: 6px;
        padding: 5px 10px; cursor: pointer; font: inherit;
      }
      #bar button:hover { border-color: var(--accent); }
      #bar button:disabled { opacity: 0.4; cursor: default; border-color: #3a3a40; }
      #spacer { flex: 1; }
      #status { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #status.bad { color: var(--bad); }
      #stage { position: fixed; inset: 46px 0 0 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="bar">
      <label>Color <input id="color" type="color" value="#111111" /></label>
      <label>Size <input id="size" type="range" min="1" max="24" value="4" /></label>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="clear">Clear</button>
      <label><input id="smoothLive" type="checkbox" checked /> Smooth while drawing</label>
      <label><input id="showRaw" type="checkbox" /> Show raw (red)</label>
      <div id="spacer"></div>
      <div id="status">loading engine…</div>
    </div>
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
